server:
  port: 8080

spring:
  application:
    name: mini-omni-merchant

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # 关掉 Spring AI 对 OpenAI 的自动配置：
  # DeepSeek ChatModel 与 Qwen Embedding 都由项目手动构建（OpenAI 兼容），
  # 不需要 chat/embedding/audio/image/moderation 这些自动配置的 Bean。
  ai:
    model:
      chat: none
      embedding: none
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

  # MySQL：业务主数据源（MyBatis-Plus）。由 bootstrap 的 DataSourceConfig 显式声明为 @Primary。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mini-omni-merchant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


# ============================================================
# 本项目统一配置来源（正式入口：omni-merchant-bootstrap）。
# 本阶段为本地开发联调，其余配置直接写在此文件，不经过环境变量。
# 仅认证相关密钥 / 引导账号必须来自环境变量，不允许提交真实值到 Git。
# ============================================================
admin:
  # 首次启动平台管理员引导账号：从环境变量读取（未配置且尚无平台管理员时启动失败）。
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
  # JWT 签名密钥：必须来自环境变量 JWT_SECRET（长度至少 32 字节），缺失则启动失败。
  jwt-secret: ${JWT_SECRET:}
  # 允许换钥：旧密钥仅在轮换过渡期使用。
  jwt-previous-secret: ${JWT_PREVIOUS_SECRET:}
  # Access Token 有效期（毫秒），默认 1 天。
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Refresh Token 有效期（毫秒），默认 30 天。
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  issuer: omnimerchant-admin
  audience: omnimerchant-admin-api

app:

  # DeepSeek（OpenAI 兼容接口）—— Agent 主链固定使用该模型。
  llm:
    deepseek:
      api-key: sk-6c681004dc0f45c0a2dc1aa2c3b96178
      base-url: https://api.deepseek.com
      model: deepseek-flash

    # 三层模型调用限流（当前未复现 Tenant 配额体系，先用开发期静态配额）。
    # Redis Key 仍包含真实 tenantId，不同会话共享同一租户额度。
    rate-limit:
      # 第一层：单位时间（固定窗口）请求数上限。
      qps-limit: 5
      qps-window-seconds: 1
      # 第二层：月度 Token 预算（0 = 不限）。
      monthly-token-budget: 100000
      # 第三层：同租户并发模型调用上限。
      concurrent-limit: 3
      # 并发租约有效期（秒）：进程崩溃后靠它自动回收，避免计数永久残留。
      concurrent-lease-seconds: 120

    # LLM 熔断 / 超时 / 安全重试。
    resilience:
      # 每次模型响应间隔的超时（不等于整轮 Agent 总时长）。
      timeout-seconds: 70
      failure-rate-threshold: 50
      minimum-number-of-calls: 5
      sliding-window-size: 10
      wait-duration-in-open-state-seconds: 30
      # 最多重试次数：主链可能触发 Tool Calling，默认关闭自动重试（0），
      # 仅保留安全重试机制与测试；确认安全后可调大。
      max-retries: 0
      retry-backoff-ms: 300

  # PostgreSQL / PgVector —— RAG 检索库（knowledge 模块使用）。
  pgvector:
    url: jdbc:postgresql://localhost:5433/omni_rag
    username: postgres
    password: 123456
    # 与 Embedding 模型输出维度保持一致。
    dimensions: 1024
    table-name: policy_vectors

  # Qwen Embedding —— 百炼 OpenAI 兼容接口。
  embedding:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # TODO 替换为真实百炼 API Key
    api-key: sk-ws-H.PILYEYR.fAVi.MEYCIQDoJtYsExZAyA4OZL3daxny-JAx1PkflO0B6eb4S2z-VAIhALulBNKIUSP5r_rD6zHZQFxfWVcyZiIspUTtd7F4KN6k
    model: text-embedding-v3

  # Qwen Reranker —— 百炼精排接口（不可用时自动降级为召回排名）。
  reranker:
    url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    # TODO 替换为真实百炼 API Key
    api-key: sk-ws-H.PILYEYR.fAVi.MEYCIQDoJtYsExZAyA4OZL3daxny-JAx1PkflO0B6eb4S2z-VAIhALulBNKIUSP5r_rD6zHZQFxfWVcyZiIspUTtd7F4KN6k
    model: qwen3.7-text-rerank

  # 证据评估阈值（supportScore = rerankScore × 100）。
  # 低于 min-support-score 判定为证据不足，系统层拒答；
  # ≥2 条且平均分达到 sufficient-support-score 判定为证据充分。
  retrieval:
    min-support-score: 45
    sufficient-support-score: 70

  # 短期对话记忆（RedisChatMemory）——只保存最近上下文；
  # MySQL 的 chat_message 仍是完整历史与前端/Inbox 的权威来源。
  chat:
    memory:
      # 每次提供给模型的最近历史条数（对齐原项目「最近 12 条」）。
      last-n: 12
      # Redis 列表长度上限，超出后只保留最近若干条，防止无限增长。
      max-messages: 50
      # 每次成功更新记忆后刷新 TTL。
      ttl-days: 7

  # Agent 执行守卫：Redis 会话互斥锁。
  # 锁 TTL 短于 SSE 超时（300s），因此配合定期续期覆盖整个执行期。
  agent:
    conversation-lock:
      # 初始锁有效期（秒）；执行中会被续期刷新。
      ttl-seconds: 90
      # 续期间隔（秒）：仅当锁仍属于当前请求时才刷新 TTL。
      renew-interval-seconds: 30
